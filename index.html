<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello Sachuu ❤️</title>

<style>
body {
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ff758c, #ff7eb3, #ff4d6d);
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.container {
    text-align: center;
    color: white;
    animation: glow 2s infinite alternate;
}

h1 {
    font-size: 70px;
    margin: 0;
    text-shadow: 0 0 20px rgba(255,255,255,0.9);
}

p {
    font-size: 24px;
    margin-top: 15px;
}

.heart {
    font-size: 80px;
    animation: beat 1s infinite;
}

@keyframes beat {
    0% { transform: scale(1); }
    30% { transform: scale(1.3); }
    60% { transform: scale(1); }
}

@keyframes glow {
    from { text-shadow: 0 0 20px white; }
    to { text-shadow: 0 0 40px pink; }
}
</style>
</head>

<body>

<div class="container">
    <div class="heart">❤️</div>
    <h1>Hello Sachuu</h1>
    <p>You are Special ✨</p>
</div>

</body>
</html>
